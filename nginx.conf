server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Files are not fingerprinted, so always revalidate (cheap 304s) and a
    # redeploy shows up on the next page load. Headers are set here, at server
    # level, so every location below inherits them.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Coolify / Docker health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Optional data packs (see data/README.md): when one is not installed,
    # answer with an empty script so the game falls back to its built-in content.
    location /data/ {
        try_files $uri /data/none.js;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
