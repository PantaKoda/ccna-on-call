# Builds the desktop app for Windows, macOS and Linux.
#
# On a release tag (pushed by tools/release.mjs) the installers and the
# latest*.yml files that the in-app updater reads are attached to the GitHub
# release of that tag. Run it by hand (Actions > Desktop builds > Run workflow)
# to get the installers as a workflow artifact without releasing anything; a pull
# request that touches the desktop app does the same.
#
# Only what is in the repository goes in: the personal data packs in data/ are
# git-ignored, so they are never part of these builds.

name: Desktop builds

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**", "js/ui/desktop.js", "package.json", "package-lock.json", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build the installers
        run: npx electron-builder --config desktop/builder.config.cjs --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.blockmap dist/latest*.yml)
          [ ${#files[@]} -gt 0 ] || { echo "no installers were built"; exit 1; }
          # tools/release.mjs creates the release right after pushing the tag; wait for it
          for i in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break; echo "waiting for the release $GITHUB_REF_NAME"; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - name: Keep them as a workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ccna-on-call-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error
